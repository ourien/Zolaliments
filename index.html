<!DOCTYPE html>
<html lang="fr" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zolaliment - Guide Nutritionnel</title>
    
    <!-- Favicon thématique (Pomme verte 🍏) -->
    <link class="js-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍏</text></svg>">
    
    <!-- Chargement de Tailwind CSS avec configuration Dark Mode activée -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode:'class',
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen transition-colors duration-300 dark:bg-gray-950 dark:text-gray-100">

    <!-- En-tête de l'application (Header adaptatif avec bouton Thème) -->
    <header class="bg-emerald-600 dark:bg-emerald-900 text-white shadow-md transition-colors duration-300">
        <div class="container mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-apple-whole text-3xl"></i>
                <h1 class="text-3xl font-extrabold tracking-tight">zolaliment</h1>
            </div>
            <div class="flex items-center space-x-6">
                <p class="text-emerald-100 text-sm md:text-base text-center md:text-right hidden sm:block">
                    Votre guide simple pour comprendre ce que vous mangez.
                </p>
                <!-- Bouton Thème Jour/Nuit -->
                <button onclick="toggleTheme()" class="p-2.5 rounded-full bg-emerald-700/50 hover:bg-emerald-700 dark:bg-emerald-800/50 dark:hover:bg-emerald-800 text-white transition focus:outline-none shadow-sm flex items-center justify-center" aria-label="Changer de thème">
                    <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Section Recherche -->
        <section class="mb-10 text-center">
            <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-300 mb-4">Recherchez un aliment ou découvrez ses propriétés</h2>
            <div class="max-w-xl mx-auto relative">
                <input type="text" id="searchBar" onkeyup="filterFoods()" placeholder="Ex: Myrtille, Citron, Lentilles, Gingembre, Poulet..." 
                    class="w-full px-5 py-3 pl-12 rounded-full border border-gray-300 dark:border-gray-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition dark:bg-gray-900 dark:text-white dark:placeholder-gray-400">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
            </div>
        </section>

        <!-- Grille principale responsive -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Zone des résultats d'aliments -->
            <div class="lg:col-span-2">
                <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-6 flex items-center">
                    <i class="fa-solid fa-utensils text-emerald-600 mr-2"></i> Aliments disponibles
                </h3>
                <div id="foodsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Les cartes d'aliments seront générées ici par le script JS -->
                </div>
                <div id="noResult" class="hidden text-center py-10 text-gray-500">
                    <i class="fa-regular fa-face-frown text-4xl mb-3"></i>
                    <p>Aucun aliment ne correspond à votre recherche.</p>
                </div>
            </div>

            <!-- Formulaire d'ajout d'aliments -->
            <div class="bg-white dark:bg-gray-900 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 self-start lg:sticky lg:top-6 transition-colors duration-300">
                <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-4 flex items-center">
                    <i class="fa-solid fa-plus-circle text-emerald-600 mr-2"></i> Ajouter un aliment
                </h3>
                <form id="addFoodForm" onsubmit="addNewFood(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nom de l'aliment</label>
                        <input type="text" id="foodName" required class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-800 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 text-sm dark:bg-gray-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Lien de l'image (Optionnel)</label>
                        <input type="url" id="foodImg" placeholder="https://exemple.com/image.jpg" class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-800 rounded-lg text-sm dark:bg-gray-800 dark:text-white">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Calories (kcal)</label>
                            <input type="number" id="foodCal" required class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-800 rounded-lg text-sm dark:bg-gray-800 dark:text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Protéines (g)</label>
                            <input type="number" step="0.1" id="foodProt" required class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-800 rounded-lg text-sm dark:bg-gray-800 dark:text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Glucides (g)</label>
                            <input type="number" step="0.1" id="foodCarb" required class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-800 rounded-lg text-sm dark:bg-gray-800 dark:text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Lipides (g)</label>
                            <input type="number" step="0.1" id="foodLip" required class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-800 rounded-lg text-sm dark:bg-gray-800 dark:text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Bienfaits sur le corps</label>
                        <textarea id="foodBenefits" required rows="2" class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-800 rounded-lg text-sm dark:bg-gray-800 dark:text-white" placeholder="Ex: Améliore la digestion, riche en antioxydants..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Méfaits ou Précautions</label>
                        <textarea id="foodHarms" required rows="2" class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-800 rounded-lg text-sm dark:bg-gray-800 dark:text-white" placeholder="Ex: À consommer avec modération en cas de diabète..."></textarea>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg transition text-sm">
                        Ajouter à la liste
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Modal pour l'affichage de l'image en grand (Lightbox) -->
    <div id="imageModal" onclick="closeModal(event)" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="relative max-w-3xl w-full bg-white dark:bg-gray-900 rounded-2xl overflow-hidden shadow-2xl flex flex-col transition-colors duration-300" onclick="event.stopPropagation()">
            <button onclick="closeModal(null)" class="absolute top-4 right-4 bg-black/60 hover:bg-black text-white rounded-full w-10 h-10 flex items-center justify-center transition z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <img id="modalImg" src="" alt="" class="w-full max-h-[75vh] object-cover">
            <div class="p-4 bg-white dark:bg-gray-900 text-center border-t dark:border-gray-800">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800 dark:text-white"></h3>
            </div>
        </div>
    </div>

    <footer class="bg-gray-800 text-gray-400 py-6 mt-12">
        <div class="container mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 <strong>zolaliment</strong>. Conçu pour informer sur la nutrition.</p>
        </div>
    </footer>

        // Fonction pour afficher les aliments à l'écran
        function displayFoods(foodList) {
            const container = document.getElementById('foodsContainer');
            const noResult = document.getElementById('noResult');
            container.innerHTML = '';

            if (foodList.length === 0) {
                noResult.classList.remove('hidden');
                return;
            } else {
                noResult.classList.add('hidden');
            }

            foodList.forEach(food => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-900 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden flex flex-col justify-between hover:shadow-md transition duration-300";
                card.innerHTML = `
                    <div>
                        <!-- Image de l'Aliment (Cliquable avec zoom) -->
                        <div class="h-48 w-full overflow-hidden bg-gray-100 dark:bg-gray-800 relative group cursor-pointer" onclick="openModal('${food.image}', '${food.name}')">
                            <img src="${food.image}" alt="${food.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            
                            <!-- Indicateur visuel d'agrandissement -->
                            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 flex items-center justify-center transition duration-300">
                                <span class="bg-white/90 dark:bg-gray-800/90 text-gray-800 dark:text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center shadow-sm">
                                    <i class="fa-solid fa-magnifying-glass-plus mr-1"></i> Agrandir
                                </span>
                            </div>

                            <span class="absolute top-3 right-3 text-xs font-semibold bg-white/95 dark:bg-gray-800 text-gray-800 dark:text-white px-3 py-1.5 rounded-full shadow-sm backdrop-blur-sm z-10" onclick="event.stopPropagation()">
                                ${food.calories} kcal <span class="text-gray-500">/ 100g</span>
                            </span>
                        </div>

                        <div class="p-6">
                            <h4 class="text-xl font-bold text-gray-800 dark:text-white mb-3 border-b pb-2 dark:border-gray-800">
                                ${food.name}
                            </h4>
                            
                            <!-- Valeurs Nutritionnelles -->
                            <div class="grid grid-cols-3 gap-2 text-center text-xs mb-4">
                                <div class="bg-blue-50 dark:bg-blue-950/40 text-blue-800 dark:text-blue-300 p-2 rounded-lg">
                                    <span class="font-bold block">${food.proteins}g</span> Protéines
                                </div>
                                <div class="bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 p-2 rounded-lg">
                                    <span class="font-bold block">${food.carbs}g</span> Glucides
                                </div>
                                <div class="bg-red-50 dark:bg-red-950/40 text-red-800 dark:text-red-300 p-2 rounded-lg">
                                    <span class="font-bold block">${food.lipids}g</span> Lipides
                                </div>
                            </div>

                            <!-- Bienfaits -->
                            <div class="mb-4">
                                <h5 class="text-sm font-semibold text-emerald-700 dark:text-emerald-400 flex items-center mb-1">
                                    <i class="fa-solid fa-circle-check mr-1.5"></i> Bienfaits
                                </h5>
                                <p class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed">${food.benefits}</p>
                            </div>

                            <!-- Méfaits -->
                            <div>
                                <h5 class="text-sm font-semibold text-rose-700 dark:text-rose-400 flex items-center mb-1">
                                    <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Méfaits & Précautions
                                </h5>
                                <p class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed">${food.harms}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Fonctions pour gérer le Thème Jour/Nuit
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            const themeIcon = document.getElementById('themeIcon');
            
            if (isDark) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        // Fonctions pour gérer la visionneuse d'image (Modal/Lightbox)
        function openModal(imageSrc, foodName) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalTitle = document.getElementById('modalTitle');

            modalImg.src = imageSrc;
            modalImg.alt = foodName;
            modalTitle.textContent = foodName;

            modal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden'); // Empêche de scroller le fond
        }

        function closeModal(event) {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }

        // Fermeture du modal avec la touche Échap
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });

        // Fonction pour filtrer les aliments lors de la recherche
        function filterFoods() {
            const query = document.getElementById('searchBar').value.toLowerCase().trim();
            const filtered = foods.filter(food => food.name.toLowerCase().includes(query));
            displayFoods(filtered);
        }

        // Fonction pour ajouter un nouvel aliment
        function addNewFood(event) {
            event.preventDefault();

            const name = document.getElementById('foodName').value;
            let image = document.getElementById('foodImg').value.trim();
            const calories = parseInt(document.getElementById('foodCal').value);
            const proteins = parseFloat(document.getElementById('foodProt').value);
            const carbs = parseFloat(document.getElementById('foodCarb').value);
            const lipids = parseFloat(document.getElementById('foodLip').value);
            const benefits = document.getElementById('foodBenefits').value;
            const harms = document.getElementById('foodHarms').value;

            // Image par défaut si l'URL est vide
            if (!image) {
                image = "https://images.unsplash.com/photo-1490818621748-5b3e2b3dd44e?w=400&auto=format&fit=crop&q=60";
            }

            const newFood = { name, image, calories, proteins, carbs, lipids, benefits, harms };

            // Ajouter au début du tableau pour qu'il apparaisse en premier
            foods.unshift(newFood);

            // Réinitialiser le formulaire
            document.getElementById('addFoodForm').reset();

            // Effacer la barre de recherche pour tout afficher
            document.getElementById('searchBar').value = '';

            // Mettre à jour l'affichage
            displayFoods(foods);
        }

        // Chargement initial des données et du thème
        window.onload = function() {
            loadTheme();
            displayFoods(foods);
        };
    </script>
</body>
</html>
